<html lang="ko">
<head>

  <style>
    :root{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#26334c;background:#fbf8ff;font-synthesis:none;--ink:#26334c;--sub:#63728a;--purple:#7768dd;--purple-light:#eeeaff;--mint:#e1f8ee;--line:#e5e5ef;--white:#fff;--shadow:0 16px 45px rgba(82,72,139,.09)}

    .student-wrap{max-width:1050px;margin:0 auto}.intro{text-align:center;margin-bottom:26px}.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #ede8f6;color:#7868bf;border-radius:100px;padding:8px 17px;font-size:15px;font-weight:900;box-shadow:0 5px 20px #6f5fb013}.intro h1{font-size:clamp(30px,5.5vw,51px);letter-spacing:-2.5px;line-height:1.23;margin:16px 0 11px;font-weight:950}.intro h1 em{font-style:normal;color:var(--purple)}.intro p{color:var(--sub);font-size:clamp(16px,2.4vw,21px);font-weight:700;margin:0;line-height:1.6}.steps{max-width:700px;display:flex;gap:10px;margin:28px auto 30px;align-items:center}.step{height:12px;border-radius:100px;flex:1;background:#e8e5f0;transition:background .2s}.step.done{background:#b7eacb}.step.current{background:var(--purple)}.stage{background:rgba(255,255,255,.92);border:1px solid #ede9f1;border-radius:32px;box-shadow:var(--shadow);padding:clamp(21px,4vw,43px);min-height:420px}.stage-heading{text-align:center;margin:0 0 27px}.stage-heading .icon-pill{width:75px;height:75px;border-radius:24px;background:#fff6dd;display:grid;place-items:center;font-size:40px;margin:0 auto 16px}.stage-heading h2{font-size:clamp(27px,4.2vw,38px);letter-spacing:-1.4px;line-height:1.3;margin:0 0 9px;font-weight:950}.stage-heading p{margin:0;color:#718099;font-weight:750;font-size:clamp(16px,2.2vw,19px)}

    .teacher{max-width:1140px;margin:auto}.teacher-hero{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;margin-bottom:19px}.teacher-hero h1{font-size:clamp(29px,4vw,41px);letter-spacing:-1.5px;margin:0 0 7px}.teacher-hero p{margin:0;color:var(--sub);font-weight:700;line-height:1.5}.date-bubble{border:1px solid #e8e4f0;background:#fff;border-radius:16px;padding:13px 16px;color:#695b99;font-weight:900}.tabs{display:flex;gap:7px;background:#eeeaf6;border-radius:19px;padding:7px;margin:24px 0;max-width:650px}.tab{flex:1;border:0;border-radius:14px;min-height:53px;background:transparent;font-size:16px;font-weight:900;color:#847d99}.tab.active{color:#5446b0;background:white;box-shadow:0 3px 10px #45368a14}.summary-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.summary-card{background:white;border:1px solid #eae8f1;border-radius:23px;padding:23px;box-shadow:0 5px 20px #675e8810}.summary-card .caption{font-size:15px;font-weight:850;color:#747f94}.summary-card .large{display:block;font-size:37px;font-weight:950;margin-top:6px;letter-spacing:-1px}.summary-card:first-child .large{color:#7768dd}.summary-card:nth-child(2) .large{color:#2a9d79}.summary-card:nth-child(3) .large{color:#e08c4b}.panel{background:#fff;border:1px solid #eae7f1;box-shadow:0 9px 25px #5446930a;border-radius:25px;padding:clamp(19px,3vw,30px);margin-bottom:18px}.panel h2{font-size:23px;letter-spacing:-.7px;margin:0 0 9px}.panel p.note{font-size:14px;color:#7a8498;margin:0 0 22px;line-height:1.7;font-weight:650}.panel-header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}.panel-header h2{margin:0}.attendance-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.attendance{border:1.5px solid #e9e6f1;border-radius:15px;padding:13px 10px;background:#fcfbfe;min-height:76px}.attendance.checked{background:#effaf3;border-color:#bde7cf}.attendance .main{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attendance .small{color:#8290a1;font-size:12px;font-weight:750;margin-top:5px}.attendance.checked .small{color:#3c936e}.history-tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 17px}.field{border:1.7px solid #e6e5ee;border-radius:13px;padding:12px 13px;background:#fff;color:#303b55;min-height:47px;font-size:15px;min-width:155px}.record-list{display:grid;gap:11px}.record{border:1px solid #eae7f1;border-radius:18px;padding:18px;display:grid;gap:12px}.record-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}.record-top strong{font-size:18px}.record-top time{color:#8992a4;font-size:14px;font-weight:750}.record-detail{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f1effd;color:#6558af;border-radius:99px;padding:9px 13px;font-size:14px;font-weight:800;line-height:1.4}.chip.green{background:#e6f7ed;color:#31835b}.chip.orange{background:#fff1e2;color:#ab6c29}.record-q{color:#758197;font-weight:700;font-size:14px;margin-top:2px;overflow-wrap:anywhere}.record-q strong{color:#37435d}.empty{text-align:center;padding:40px 12px;color:#8b8aa0;font-weight:800;background:#faf9fd;border-radius:17px;border:1px dashed #ddd8ed}.empty .big{font-size:38px;margin-bottom:10px}.chart-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.chart-layout .panel:last-child{grid-column:1/-1}.chart-row{display:grid;grid-template-columns:minmax(130px,1fr) 2fr 78px;align-items:center;gap:10px;margin:20px 0}.chart-name{font-size:15px;font-weight:850;overflow-wrap:anywhere}.bar-bg{height:18px;border-radius:100px;background:#efedf4;overflow:hidden}.bar{height:100%;border-radius:100px;background:#a99cf4;min-width:0}.bar.mint{background:#83d5b3}.bar.peach{background:#ffbb89}.chart-numbers{text-align:right;font-size:14px;font-weight:850;color:#637088;white-space:nowrap}.stats-explain{font-size:14px;color:#8b8aa0;line-height:1.6;font-weight:700;margin-bottom:18px}
    .settings-cols{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}.section-label{font-size:15px;font-weight:900;margin:20px 0 9px;display:block;color:#526077}.full-input{width:100%;border:1.8px solid #e4e1ef;border-radius:14px;padding:13px 15px;min-height:48px;font-size:16px;outline:none}.full-input:focus{border-color:#a698ec}.edit-row{display:flex;gap:9px;align-items:center;margin:0 0 9px}.row-index{flex:0 0 42px;font-weight:900;color:#7b6db7;text-align:center}.edit-row .full-input{min-width:0;flex:1}.outline-btn{padding:12px 15px;background:#f9f7ff;border:1.5px solid #e7e2f7;border-radius:13px;font-size:15px;color:#6a5aab;font-weight:850;min-height:46px}.danger-icon{border:0;color:#c86d73;background:#fff0f1;border-radius:12px;flex:0 0 43px;height:43px;font-size:20px;font-weight:900}.save-row{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}.save-btn{border:0;background:#7568d8;color:#fff;border-radius:15px;padding:14px 23px;min-height:52px;font-weight:900;font-size:17px}.save-btn:hover{background:#6559bd}.hint{font-size:13px;color:#8a94a3;line-height:1.6;font-weight:700}.teacher-settings-footer{margin-top:17px;background:#fcfbff;border-radius:17px;padding:19px;border:1px solid #eee9f6}.teacher-settings-footer .row{display:flex;gap:11px;align-items:center;flex-wrap:wrap;justify-content:space-between}.status-ok{font-size:14px;color:#278561;font-weight:850}.status-error{font-size:14px;color:#bf4954;font-weight:850}.toast{position:fixed;bottom:27px;left:50%;transform:translateX(-50%);z-index:30;background:#2e3a52;color:#fff;border-radius:16px;padding:13px 21px;box-shadow:0 15px 25px #2228;font-weight:850;max-width:90vw;text-align:center}
    .modal-cover{position:fixed;inset:0;z-index:40;background:#27314bbb;display:flex;align-items:center;justify-content:center;padding:22px}.modal{width:min(450px,100%);background:#fff;border-radius:27px;box-shadow:0 25px 75px #1115;padding:30px}.modal h2{font-size:26px;letter-spacing:-1px;margin:0 0 12px}.modal p{font-size:15px;color:#667389;font-weight:700;line-height:1.7}.modal label{display:block;font-size:15px;font-weight:900;margin:17px 0 8px}.modal input{width:100%;min-height:55px;border-radius:13px;border:2px solid #e7e4f0;padding:10px 14px;font-size:22px;letter-spacing:6px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:23px}.modal-actions button{min-height:51px}.hide{display:none!important}
    @keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}72%{transform:scale(1.12) rotate(3deg)}100%{transform:scale(1);opacity:1}}@keyframes drain{to{transform:scaleX(0)}}
    @media(max-width:800px){.shell{padding:19px 16px 46px}.student-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.attendance-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.settings-cols{grid-template-columns:1fr}.stage{padding:23px}.chart-layout{grid-template-columns:1fr}.chart-layout .panel:last-child{grid-column:auto}}
    @media(max-width:560px){.topbar{margin-bottom:26px}.brand{font-size:18px;gap:8px}.brand-mark{height:42px;width:42px;font-size:22px}.brand small{font-size:11px}.top-actions .subtle-btn{padding:10px;min-height:45px;font-size:12px}.intro h1{letter-spacing:-1.4px}.student-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.student-choice{min-height:86px;border-radius:17px}.student-choice .num{font-size:25px}.student-choice .student-name{font-size:12px}.stage{min-height:390px;border-radius:23px;padding:19px 14px}.stage-heading .icon-pill{width:65px;height:65px;font-size:33px;border-radius:21px}.option-grid,.option-grid.three{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option-choice{min-height:139px;border-radius:19px}.option-choice .emoji{font-size:39px}.option-choice .choice-label{font-size:18px}.option-choice.answer{grid-column:1/-1;min-height:94px}.attendance-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.summary-cards{gap:8px}.summary-card{padding:14px 10px;border-radius:17px}.summary-card .large{font-size:29px}.summary-card .caption{font-size:12px}.tab{font-size:13px;padding:0 4px}.chart-row{grid-template-columns:minmax(100px,1.1fr) minmax(60px,1.5fr) 61px;gap:6px}.chart-name,.chart-numbers{font-size:12px}.panel{border-radius:18px}.record-detail .chip{font-size:12px}}

<body>
  <main id="app"></main>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script>
  (()=>{
    'use strict';
    const STORAGE_KEY='sparkle_checkin_kiosk_2026_v1';
    const MOODS=[{id:'happy',emoji:'😄',label:'기분 좋아요'},{id:'okay',emoji:'🙂',label:'괜찮아요'},{id:'sad',emoji:'😢',label:'속상해요'},{id:'sleepy',emoji:'🥱',label:'졸려요'},{id:'worried',emoji:'😟',label:'걱정돼요'}];
    const HEALTH=[{id:'great',emoji:'💪',label:'아주 건강해요'},{id:'normal',emoji:'😊',label:'보통이에요'},{id:'tired',emoji:'😴',label:'피곤해요'},{id:'sick',emoji:'🤒',label:'몸이 아파요'}];
    const defaultData=()=>({version:1,students:Array.from({length:20},(_,i)=>({id:`student-${i+1}`,name:''})),question:{text:'오늘 아침 준비물을 잘 챙겨왔나요?',options:[{id:'answer-1',text:'네, 잘 챙겨왔어요!'},{id:'answer-2',text:'아니요, 깜빡했어요.'}]},records:[],teacherPinHash:null});
    const escapeHtml=(value)=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const uid=()=>`id-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
    const dateKey=(date)=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const formatTime=(iso)=>new Date(iso).toLocaleString('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const formatDay=()=>new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    let storageEnabled=true;
    function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultData();const value=JSON.parse(raw);if(!value||!Array.isArray(value.students)||!Array.isArray(value.records)||!value.question||!Array.isArray(value.question.options))return defaultData();return {...defaultData(),...value};}catch(e){storageEnabled=false;return defaultData();}}
    let data=load();
    function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));storageEnabled=true;}catch(e){storageEnabled=false;showToast('저장할 수 없어요. 브라우저 저장 공간을 확인해 주세요.');}}
    let view='student',step=0,draft={},tab='records',historyPeriod='today',historyStudent='all',settingsDraft=null,resetTimer=null,modalMode=null,toastTimer=null;
    const app=document.getElementById('app');
    const todayRecords=()=>data.records.filter(r=>r.day===dateKey(new Date()));
    function latestToday(){const active=new Set(data.students.map(s=>s.id));const latest=new Map();for(const rec of todayRecords()){if(active.has(rec.studentId)){const prev=latest.get(rec.studentId);if(!prev||rec.createdAt>=prev.createdAt)latest.set(rec.studentId,rec);}}return latest;}
    const studentLabel=(student,index)=>`${index+1}번${student.name?.trim()?` · ${student.name.trim()}`:''}`;
    function pageTop(teacher=false){return `<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">🌟</div><div>반짝반짝 오늘의 체크인<small>우리 반의 하루를 시작해요</small></div></div><div class="top-actions">${teacher?'<button class="subtle-btn" data-action="go-student">↩ 학생 화면으로</button>':'<button class="subtle-btn" data-action="open-teacher">⚙️ 선생님 메뉴</button>'}</div></header>${!storageEnabled?'<div class="status-notice" role="alert">이 브라우저에서는 현재 기록을 저장할 수 없어요. 일반 브라우저 모드에서 다시 열어 주세요.</div>':''}`;}
    const stepHtml=()=>`<div class="steps" role="img" aria-label="${step+1}단계 / 총 4단계">${[0,1,2,3].map(i=>`<span class="step ${i<step?'done':i===step?'current':''}"></span>`).join('')}</div>`;
    const heading=(emoji,title,sub)=>`<div class="stage-heading"><div class="icon-pill" aria-hidden="true">${emoji}</div><h2 id="stage-title">${title}</h2><p>${sub}</p></div>`;
    function studentScreen(){let body='';
      if(step===0){body=heading('👋','안녕! 몇 번 친구인가요?','내 번호 또는 이름을 찾아서 눌러 주세요!')+`<div class="search-area"><span aria-hidden="true">🔎</span><input type="search" id="student-search" placeholder="번호나 이름 찾기" aria-label="학생 번호나 이름 찾기" autocomplete="off"></div><div class="student-grid" id="student-grid">${data.students.map((s,i)=>`<button type="button" class="student-choice" data-action="select-student" data-index="${i}" data-search="${escapeHtml(`${i+1} ${s.name??''}`.toLowerCase())}"><span class="num">${i+1}번</span>${s.name?.trim()?`<span class="student-name">${escapeHtml(s.name)}</span>`:''}</button>`).join('')}</div><div class="empty hide" id="no-students">찾는 친구가 없어요.</div>`;}
      if(step===1)body=heading('🌈',`${escapeHtml(draft.studentLabel)} 친구!`, '오늘 기분은 어때요?')+choicesHtml(MOODS,'mood');
      if(step===2)body=heading('💗','오늘 몸은 어떤가요?','지금 내 몸 상태를 골라 주세요!')+choicesHtml(HEALTH,'health');
      if(step===3)body=heading('💬','선생님의 질문이에요!','생각하고 알맞은 답을 눌러 주세요!')+`<p style="text-align:center;font-size:clamp(21px,3vw,29px);font-weight:950;line-height:1.5;margin:-4px 0 25px;overflow-wrap:anywhere">${escapeHtml(data.question.text)}</p><div class="option-grid">${data.question.options.map((opt,i)=>`<button class="option-choice answer" data-action="answer" data-index="${i}"><span class="emoji" aria-hidden="true">${['🙆','🙋','✨','🌼','💡','💛'][i%6]}</span><span class="choice-label">${escapeHtml(opt.text)}</span></button>`).join('')}</div>`;
      return `<section class="student-wrap"><div class="intro"><span class="eyebrow">✨ 오늘도 반가워요!</span><h1>오늘 나의 마음을 <em>알려줘!</em></h1><p>하나씩 톡톡 누르면 체크인 완료!</p></div>${stepHtml()}<div class="stage" aria-labelledby="stage-title">${body}<div class="stage-footer">${step>0?'<button class="back-btn" data-action="back">← 이전으로</button>':'<span></span>'}<span class="stage-tag">${step+1} / 4 단계</span></div></div><p class="footer-note">🌼 천천히 골라도 괜찮아요. 정답은 없답니다!</p></section>`;}
    function choicesHtml(items,type){return `<div class="option-grid ${items.length>=5?'three':''}">${items.map((item,i)=>`<button class="option-choice" data-action="select-${type}" data-index="${i}"><span class="emoji" aria-hidden="true">${item.emoji}</span><span class="choice-label">${escapeHtml(item.label)}</span></button>`).join('')}</div>`;}
    function thanksScreen(){return `<section class="student-wrap"><div class="stage thanks-wrap"><div class="thanks-emoji" aria-hidden="true">🎉</div><h2>고마워, ${escapeHtml(draft.studentLabel)} 친구!</h2><p>오늘의 마음을 알려줘서 고마워요!<br>멋진 하루를 함께 시작해요. 💖</p><button class="done-btn" data-action="reset">다음 친구 시작하기 →</button><div class="timer-track" aria-hidden="true"><span></span></div><p class="timer-hint">잠시 후 자동으로 처음 화면으로 돌아가요.</p></div></section>`;}
    function render(){app.innerHTML=`<div class="shell">${pageTop(view==='teacher')}${view==='student'?studentScreen():view==='thanks'?thanksScreen():teacherScreen()}</div>`;}
    function beginStep(next){step=next;render();window.scrollTo({top:0,behavior:'instant'});}
    function resetCheckin(){clearTimeout(resetTimer);resetTimer=null;view='student';step=0;draft={};render();}
    function finish(answer){const student=data.students.find(s=>s.id===draft.studentId);if(!student){showToast('학생 명단을 다시 확인해 주세요.');resetCheckin();return;}const now=new Date();draft.answer=answer.text;data.records.push({id:uid(),studentId:draft.studentId,studentLabel:draft.studentLabel,mood:draft.mood,health:draft.health,question:data.question.text,answer:answer.text,answerId:answer.id,createdAt:now.toISOString(),day:dateKey(now)});save();view='thanks';render();resetTimer=setTimeout(resetCheckin,5500);}
    function summaryCards(){const count=latestToday().size,total=data.students.length;return `<div class="summary-cards"><div class="summary-card"><span class="caption">✅ 오늘 체크인</span><span class="large">${count}명</span></div><div class="summary-card"><span class="caption">👧 우리 반 학생</span><span class="large">${total}명</span></div><div class="summary-card"><span class="caption">🕘 아직 안 한 학생</span><span class="large">${Math.max(0,total-count)}명</span></div></div>`;}
    function teacherScreen(){return `<section class="teacher"><div class="teacher-hero"><div><h1>🍀 선생님 메뉴</h1><p>우리 반 친구들의 오늘 하루를 한눈에 살펴봐요.</p></div><div class="date-bubble">📅 ${formatDay()}</div></div>${summaryCards()}<nav class="tabs" aria-label="선생님 메뉴 탭"><button class="tab ${tab==='records'?'active':''}" data-action="tab" data-tab="records" aria-current="${tab==='records'?'page':'false'}">📋 학생별 기록</button><button class="tab ${tab==='stats'?'active':''}" data-action="tab" data-tab="stats" aria-current="${tab==='stats'?'page':'false'}">📊 학급 통계</button><button class="tab ${tab==='settings'?'active':''}" data-action="tab" data-tab="settings" aria-current="${tab==='settings'?'page':'false'}">⚙️ 설정</button></nav>${tab==='records'?recordsScreen():tab==='stats'?statsScreen():settingsScreen()}</section>`;}
    function recordsScreen(){const latest=latestToday();const filtered=data.records.filter(r=>(historyPeriod==='all'||r.day===dateKey(new Date()))&&(historyStudent==='all'||r.studentId===historyStudent)).slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
      const studentsAll=new Map(data.students.map((s,i)=>[s.id,studentLabel(s,i)]));for(const r of data.records)if(!studentsAll.has(r.studentId))studentsAll.set(r.studentId,`${r.studentLabel||'이전 학생'} (명단에서 삭제됨)`);
      return `<section class="panel"><div class="panel-header"><h2>오늘 누가 체크인했나요?</h2><span class="hint">초록색은 체크인 완료!</span></div><div class="attendance-grid">${data.students.map((s,i)=>{const r=latest.get(s.id);return `<div class="attendance ${r?'checked':''}"><div class="main">${escapeHtml(studentLabel(s,i))}</div><div class="small">${r?'✔ 완료 · '+new Date(r.createdAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'○ 아직 체크인 전'}</div></div>`}).join('')}</div></section><section class="panel"><h2>학생별 응답 기록</h2><p class="note">같은 학생이 여러 번 체크인한 경우 모든 기록을 보관해요. 통계에는 오늘 가장 마지막 체크인만 반영돼요.</p><div class="history-tools"><select class="field" aria-label="기록 기간" id="history-period"><option value="today" ${historyPeriod==='today'?'selected':''}>오늘 기록</option><option value="all" ${historyPeriod==='all'?'selected':''}>전체 기록</option></select><select class="field" id="history-student" aria-label="기록을 볼 학생"><option value="all">모든 학생</option>${Array.from(studentsAll).map(([id,label])=>`<option value="${escapeHtml(id)}" ${historyStudent===id?'selected':''}>${escapeHtml(label)}</option>`).join('')}</select></div>${filtered.length?`<div class="record-list">${filtered.map(r=>`<article class="record"><div class="record-top"><strong>🧒 ${escapeHtml(r.studentLabel||studentsAll.get(r.studentId)||'학생')}</strong><time datetime="${escapeHtml(r.createdAt)}">${formatTime(r.createdAt)}</time></div><div class="record-detail"><span class="chip">🌈 기분: ${escapeHtml(r.mood)}</span><span class="chip green">💗 몸: ${escapeHtml(r.health)}</span><span class="chip orange">💬 답: ${escapeHtml(r.answer)}</span></div><div class="record-q">질문: <strong>${escapeHtml(r.question)}</strong></div></article>`).join('')}</div>`:'<div class="empty"><div class="big">📝</div>조건에 맞는 체크인 기록이 아직 없어요.</div>'}</section>`;}
    function statsScreen(){const rows=[...latestToday().values()];const n=rows.length;const moodOpts=MOODS.map(o=>({label:`${o.emoji} ${o.label}`,value:o.label}));const healthOpts=HEALTH.map(o=>({label:`${o.emoji} ${o.label}`,value:o.label}));const answers=data.question.options.map(o=>({label:o.text,value:o.text}));for(const r of rows)if(!answers.some(o=>o.value===r.answer))answers.push({label:r.answer,value:r.answer});return `<p class="stats-explain">📍 <strong>오늘 체크인한 ${n}명</strong>의 학생을 기준으로 계산했어요. 같은 학생이 여러 번 응답했다면 가장 최근 응답만 집계해요. 비율은 체크인한 학생 중 해당 항목을 선택한 비율이에요.</p><div class="chart-layout">${chartPanel('🌈 오늘의 기분','mood',moodOpts,rows,'purple')}${chartPanel('💗 오늘의 몸 상태','health',healthOpts,rows,'mint')}${chartPanel('💬 선생님 질문의 답','answer',answers,rows,'peach')}</div>`;}
    function chartPanel(title,field,options,rows,theme){const n=rows.length;return `<section class="panel"><div class="panel-header"><h2>${title}</h2><span class="hint">응답 ${n}명</span></div>${options.map(o=>{const count=rows.filter(r=>r[field]===o.value).length;const percent=n?Math.round(count/n*100):0;return `<div class="chart-row"><div class="chart-name">${escapeHtml(o.label)}</div><div class="bar-bg" role="img" aria-label="${escapeHtml(o.label)} ${count}명, ${percent}퍼센트"><div class="bar ${theme==='purple'?'':theme}" style="width:${percent}%"></div></div><div class="chart-numbers">${count}명 · ${percent}%</div></div>`}).join('')}${n===0?'<p class="note" style="margin:15px 0 0">아직 오늘의 응답이 없어요. 체크인을 시작해 주세요.</p>':''}</section>`;}
    function settingsScreen(){if(!settingsDraft)settingsDraft={students:data.students.map(s=>({...s})),question:{text:data.question.text,options:data.question.options.map(o=>({...o}))}};return `<div class="settings-cols"><section class="panel"><h2>👧 학생 명단</h2><p class="note">학생 이름은 비워 두면 번호만 표시돼요. 아래 순서대로 번호가 자동으로 정해집니다.</p><div id="student-settings-list">${settingsDraft.students.map((s,i)=>studentEditRow(s,i)).join('')}</div><button class="outline-btn" data-action="add-student">＋ 학생 추가하기</button><p class="hint" style="margin-top:12px">학생 수는 1~60명으로 설정할 수 있어요.</p></section><section class="panel"><h2>💬 학생에게 보여줄 질문</h2><p class="note">질문과 답 선택지를 자유롭게 바꿀 수 있어요. 수정 전 기록은 기존 질문과 답을 그대로 보관해요.</p><label class="section-label" for="question-input">질문 내용</label><textarea class="full-input" id="question-input" rows="3" maxlength="160">${escapeHtml(settingsDraft.question.text)}</textarea><label class="section-label">선택지 (2~6개)</label><div id="option-settings-list">${settingsDraft.question.options.map((o,i)=>optionEditRow(o,i)).join('')}</div><button class="outline-btn" data-action="add-option">＋ 선택지 추가하기</button></section></div><section class="panel"><div class="save-row"><span class="hint">변경 후에는 꼭 저장 버튼을 눌러 주세요.</span><button class="save-btn" data-action="save-settings">✓ 학급 설정 저장하기</button></div></section><section class="teacher-settings-footer"><div class="row"><div><strong>🔐 선생님 메뉴 잠금</strong><p class="hint" style="margin:7px 0 0">다른 사람이 실수로 메뉴를 여는 것을 막기 위한 간단한 PIN 잠금이에요.</p></div><button class="outline-btn" data-action="change-pin">PIN 변경하기</button></div></section><section class="panel" style="margin-top:17px"><div class="row" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><strong>오늘의 체크인 기록 초기화</strong><p class="hint" style="margin:7px 0 0">테스트 기록을 정리할 때 사용하세요. 이 작업은 되돌릴 수 없어요.</p></div><button class="danger-icon" style="width:auto;padding:0 15px;font-size:14px" data-action="clear-today">오늘 기록 삭제</button></div></section>`;}
    function studentEditRow(s,i){return `<div class="edit-row" data-student-id="${escapeHtml(s.id)}"><span class="row-index">${i+1}번</span><input class="full-input" data-student-name maxlength="25" value="${escapeHtml(s.name)}" placeholder="이름 (선택)"><button class="danger-icon" data-action="remove-student" data-index="${i}" aria-label="${i+1}번 학생 삭제">×</button></div>`;}
    function optionEditRow(o,i){return `<div class="edit-row" data-option-id="${escapeHtml(o.id)}"><span class="row-index">${i+1}</span><input class="full-input" data-option-text maxlength="90" value="${escapeHtml(o.text)}" placeholder="답 선택지"><button class="danger-icon" data-action="remove-option" data-index="${i}" aria-label="${i+1}번 선택지 삭제">×</button></div>`;}
    function collectSettings(){if(tab!=='settings'||!settingsDraft)return;settingsDraft.students=[...document.querySelectorAll('[data-student-id]')].map(row=>({id:row.dataset.studentId,name:row.querySelector('[data-student-name]').value}));settingsDraft.question.text=document.getElementById('question-input')?.value??settingsDraft.question.text;settingsDraft.question.options=[...document.querySelectorAll('[data-option-id]')].map(row=>({id:row.dataset.optionId,text:row.querySelector('[data-option-text]').value}));}
    function showToast(message){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast" role="status">${escapeHtml(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3200);}
    async function pinDigest(pin){const input='sparkle-checkin-pin-v1:'+pin;try{if(crypto?.subtle){const result=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input));return 'sha256:'+Array.from(new Uint8Array(result)).map(b=>b.toString(16).padStart(2,'0')).join('');}}catch(e){}let h=2166136261;for(let i=0;i<input.length;i++){h^=input.charCodeAt(i);h=Math.imul(h,16777619);}return 'fallback:'+((h>>>0).toString(16));}
    function showPin(mode){modalMode=mode;const create=mode==='create',change=mode==='change';const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-cover" id="modal-cover"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="pin-title"><h2 id="pin-title">${create?'🔐 선생님 PIN 만들기':change?'🔑 선생님 PIN 변경하기':'🔐 선생님만 들어오세요'}</h2><p>${create?'처음 사용하는 기기예요. 선생님 메뉴에 들어갈 때 사용할 숫자 4~8자리를 정해 주세요.':change?'새로운 숫자 4~8자리 PIN을 정해 주세요.':'설정한 PIN을 입력하면 학생 기록을 확인할 수 있어요.'}</p><form id="pin-form"><label for="pin-first">${create||change?'새 PIN':'PIN'}</label><input type="password" id="pin-first" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="off" required placeholder="••••" autofocus>${create||change?'<label for="pin-confirm">PIN 한 번 더 입력</label><input type="password" id="pin-confirm" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" autocomplete="off" required placeholder="••••">':''}<p class="status-error hide" id="pin-error" role="alert"></p><div class="modal-actions"><button type="button" class="subtle-btn" id="pin-cancel">취소</button><button type="submit" class="save-btn">${create||change?'저장하기':'들어가기'}</button></div></form><p class="hint">PIN은 이 기기의 간단한 메뉴 잠금 용도예요. 중요한 정보는 공용 기기에서 별도로 관리해 주세요.</p></div></div>`;root.querySelector('#pin-cancel').addEventListener('click',closeModal);root.querySelector('#pin-first').focus();root.querySelector('#pin-form').addEventListener('submit',handlePinSubmit);}
    function closeModal(){modalMode=null;document.getElementById('modal-root').innerHTML='';}
    async function handlePinSubmit(e){e.preventDefault();const pin=document.getElementById('pin-first').value,confirmEl=document.getElementById('pin-confirm'),error=document.getElementById('pin-error');error.classList.add('hide');const warn=text=>{error.textContent=text;error.classList.remove('hide');};if(!/^\d{4,8}$/.test(pin)){warn('숫자 4~8자리로 입력해 주세요.');return;}if(confirmEl&&pin!==confirmEl.value){warn('두 PIN이 같지 않아요.');return;}const hash=await pinDigest(pin);if(modalMode==='unlock'){if(hash!==data.teacherPinHash){warn('PIN이 맞지 않아요. 다시 확인해 주세요.');return;}closeModal();view='teacher';tab='records';render();return;}data.teacherPinHash=hash;save();const fromChange=modalMode==='change';closeModal();if(!fromChange){view='teacher';tab='records';render();}showToast(fromChange?'PIN을 변경했어요.':'선생님 PIN을 설정했어요.');}
    async function openTeacher(){clearTimeout(resetTimer);if(view==='thanks'){view='student';step=0;draft={};}showPin(data.teacherPinHash?'unlock':'create');}
    document.addEventListener('input',e=>{if(e.target.id==='student-search'){const q=e.target.value.toLowerCase().trim();let found=0;document.querySelectorAll('.student-choice').forEach(btn=>{const matches=btn.dataset.search.includes(q);btn.classList.toggle('hide',!matches);if(matches)found++;});document.getElementById('no-students')?.classList.toggle('hide',found!==0);}});
    document.addEventListener('change',e=>{if(e.target.id==='history-period'){historyPeriod=e.target.value;render();}if(e.target.id==='history-student'){historyStudent=e.target.value;render();}});
    document.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const a=btn.dataset.action,i=Number(btn.dataset.index);
      if(a==='open-teacher'){openTeacher();return;}if(a==='go-student'){resetCheckin();return;}if(a==='reset'){resetCheckin();return;}if(a==='back'&&step>0){beginStep(step-1);return;}
      if(a==='select-student'){const student=data.students[i];if(!student)return;draft={studentId:student.id,studentLabel:studentLabel(student,i)};beginStep(1);return;}
      if(a==='select-mood'){const choice=MOODS[i];if(choice){draft.mood=choice.label;beginStep(2);}return;}
      if(a==='select-health'){const choice=HEALTH[i];if(choice){draft.health=choice.label;beginStep(3);}return;}
      if(a==='answer'){const answer=data.question.options[i];if(answer)finish(answer);return;}
      if(a==='tab'){if(tab==='settings')collectSettings();tab=btn.dataset.tab;if(tab==='settings'&&!settingsDraft)settingsDraft={students:data.students.map(s=>({...s})),question:{text:data.question.text,options:data.question.options.map(o=>({...o}))}};render();return;}
      if(a==='add-student'){collectSettings();if(settingsDraft.students.length>=60){showToast('학생은 최대 60명까지 설정할 수 있어요.');return;}settingsDraft.students.push({id:uid(),name:''});render();return;}
      if(a==='remove-student'){collectSettings();if(settingsDraft.students.length<=1){showToast('학생은 최소 1명 있어야 해요.');return;}settingsDraft.students.splice(i,1);render();return;}
      if(a==='add-option'){collectSettings();if(settingsDraft.question.options.length>=6){showToast('선택지는 최대 6개까지 만들 수 있어요.');return;}settingsDraft.question.options.push({id:uid(),text:''});render();return;}
      if(a==='remove-option'){collectSettings();if(settingsDraft.question.options.length<=2){showToast('선택지는 최소 2개가 필요해요.');return;}settingsDraft.question.options.splice(i,1);render();return;}
      if(a==='save-settings'){collectSettings();const q=settingsDraft.question;if(!q.text.trim()){showToast('질문 내용을 입력해 주세요.');return;}if(q.options.some(o=>!o.text.trim())){showToast('모든 선택지에 답을 입력해 주세요.');return;}if(new Set(q.options.map(o=>o.text.trim())).size!==q.options.length){showToast('서로 다른 선택지를 입력해 주세요.');return;}data.students=settingsDraft.students.map(s=>({id:s.id,name:s.name.trim()}));data.question={text:q.text.trim(),options:q.options.map(o=>({id:o.id,text:o.text.trim()}))};save();settingsDraft=null;render();showToast('학생 명단과 질문을 저장했어요!');return;}
      if(a==='change-pin'){showPin('change');return;}
      if(a==='clear-today'){if(confirm('오늘의 체크인 기록을 모두 삭제할까요? 삭제한 기록은 복구할 수 없어요.')){data.records=data.records.filter(r=>r.day!==dateKey(new Date()));save();render();showToast('오늘 기록을 삭제했어요.');}return;}
    });
    window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&e.newValue){const fresh=load();data=fresh;if(view==='teacher')render();}});
    render();
  })();
  </script>
</body>
</html>
